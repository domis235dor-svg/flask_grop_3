{% extends 'base.html' %}

{% block content %}

<h1>Edit Project</h1>

<form method="POST" enctype="multipart/form-data" class="form">

    <label>Project Image</label>
    <input type="file" name="image" accept="image/*">

    <label>Project Title</label>
    <input
        type="text"
        name="title"
        value="{{ post.title }}"
        required
    >

    <label>Description</label>
    <textarea
        name="description"
        rows="4"
        required
    >{{ post.description }}</textarea>

    <label>Source Code</label>
    <textarea
        name="code"
        rows="12"
        required
    >{{ post.code }}</textarea>

    <button type="submit">
        Save Changes
    </button>

</form>

{% endblock %}
