{% extends 'base.html' %}

{% block content %}

<div class="auth-layout">


<div class="auth-side">
    <img src="{{ url_for('static', filename='image/register.png') }}" class="side-image">

    <div class="side-text">
        <h2>🐰 Your project </h2>
        <p>
            Каждая програма приносит свой вклад .
            поставь тут <span>RABIIT</span> и давай глянем твои идеи.
        </p>

        <div class="quote-box">
            <p>“Твои идеи всегда отоброжаются на мир.”</p>
        </div>
    </div>
</div>

<div class="auth-form-card">
    <h1>Create Account</h1>
    <p class="subtitle">Присоединяйся к комюнити RABIIT.</p>

    <form method="POST" class="form">
        <input type="text" name="username" placeholder="Username" required>
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Password" required>

        <button type="submit">Create Account</button>
    </form>
</div>


</div>

{% endblock %}
