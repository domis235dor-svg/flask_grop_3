{% extends 'base.html' %}

{% block content %}

<div class="auth-layout">


<div class="auth-side">
    <img src="{{ url_for('static', filename='image/login.png') }}" class="side-image">

    <div class="side-text">
        <h2> Welcome back to RABIIT WERE WAITING YOU</h2>
        <p>
            Покажи свой код и зделай ево лучше .
        </p>

        <div class="quote-box">
            <p>“Каждая строчка твоего кода приносит новую функцыю.”</p>
        </div>
    </div>
</div>

<div class="auth-form-card">
    <h1>Welcome Back</h1>
    <p class="subtitle">Login to continue your developer journey "  ^_____^  ".</p>

    <form method="POST" class="form">
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Password" required>

        <button type="submit">Sign In</button>
    </form>
</div>


</div>

{% endblock %}
