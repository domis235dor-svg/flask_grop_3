{% extends 'base.html' %}

{% block content %}

<h1>Publish Project</h1>

<form method="POST" enctype="multipart/form-data" class="form">


<label>Project Image</label>
<input type="file" name="image" accept="image/*">

<label>Project Title</label>
<input type="text" name="title" placeholder="My Flask Website" required>

<label>Description</label>
<textarea name="description" rows="4" placeholder="Описание проэкту ..." required></textarea>

<label>Source Code</label>
<textarea name="code" rows="12" placeholder="Выложи свой код ..." required></textarea>

<button type="submit">Publish Project</button>


</form>
{% endblock %}
