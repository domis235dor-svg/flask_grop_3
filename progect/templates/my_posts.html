{% extends 'base.html' %}

{% block content %}
<h1>My Posts</h1>

{% for post in posts %}
<div class="post-card">
    <div class="post-header">
        <h2>{{ post.title }}</h2>
        <span class="lang">{{ post.language }}</span>
    </div>

    <pre><code>{{ post.code[:300] }}{% if post.code|length > 300 %}...{% endif %}</code></pre>

    <div class="actions">
        <a class="btn" href="{{ url_for('edit_post', post_id=post.id) }}">Edit</a>
        <a class="btn danger" href="{{ url_for('delete_post_page', post_id=post.id) }}">Delete</a>
    </div>
</div>
{% else %}
<p>You have no posts.</p>
{% endfor %}
{% endblock %}
