<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редагування товару</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <header class="py-2 mb-4" style="background-color: #08588b;">
        <div class="container text-white d-flex align-items-center">
            <span class="fs-5 fw-bold">
                &#128722; Product Manager
            </span>
        </div>
    </header>

    <main class="container">
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-info text-dark mb-4" role="alert" style="background-color: #d1f2f9; border: none;">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <h2 class="text-center fw-bold mb-4">Редагування товару</h2>

        <div class="card border-0 shadow-sm p-4 mx-auto" style="max-width: 900px;">
            <p class="fw-bold mb-3">Product: <span class="fw-normal">{{ product.name }}</span></p>

            <form action="{{ url_for('edit', name_product=product.name) }}" method="POST" class="row g-3 align-items-center">
                <div class="col-md-5 d-flex align-items-center">
                    <label for="price" class="col-form-label me-2">Ціна</label>
                    <input type="number" step="0.01" class="form-control" id="price" name="price" value="{{ product.price }}" required>
                </div>

                <div class="col-md-5 d-flex align-items-center">
                    <label for="category" class="col-form-label me-2">Категорія</label>
                    <input type="text" class="form-control" id="category" name="category" value="{{ product.category }}" required>
                </div>

                <div class="col-md-2">
                    <button type="submit" class="btn text-white w-100" style="background-color: #08588b;">Зберегти</button>
                </div>
            </form>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
